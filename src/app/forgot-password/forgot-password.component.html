<div class="container-forgot-password">
  <mat-card class="forgot-password-card">
    <mat-card-content>
      <h1 class="forgot-password-title">Forgot Password</h1>
      <form (ngSubmit)="onSubmit()" #resetPasswordForm="ngForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control forgot-password-input" [(ngModel)]="username"
            name="username" required />
        </div>

        <div class="form-group">
          <label for="email1">Email</label>
          <input type="email1" id="email1" class="form-control forgot-password-input" [(ngModel)]="email1" name="email1"
            required />
        </div>

        <div class="text-center">
          <button type="submit" class="btn forgot-password-btn" [disabled]="!resetPasswordForm.form.valid">
            Submit
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
