<div class="container mb-3">
  <mat-card class="shadow p-4 mb-5 ml-0 pl-1 bg-white rounded">
    <div class="mat-card-container">
      <h1 class="attractive-title">Reject Registered Contract</h1>

      <div class="card-body">

        <div class="row form-group">
          <div class="col-sm-2">
            <label class="label_bm">Contract No<span class="required" style="color:red;">*</span></label><br>
          </div>
          <div class="col-sm-4">
            <input type="text" class="form-control" [(ngModel)]="filters.contractNo" required>
          </div>
        </div><br>

        <div class="row form-group">
          <div class="col-sm-2">
            <label class="label_bm">Type Of Contract</label><br>
          </div>
          <div class="col-sm-4">
            <select class="form-select" [(ngModel)]="filters.contractType">
              <option value="" disabled selected>--Please Select--</option>
              <option *ngFor="let type of contractTypes" [value]="type.contractType">
                {{ type.contractType }}
              </option>
            </select>
          </div>
        </div><br>

        <div class="row form-group">
          <div class="col-sm-2">
            <label class="label_bm">Company Name</label><br>
          </div>
          <div class="col-sm-4">
            <select class="form-select" [(ngModel)]="filters.companyName">
              <option value="" disabled selected>--Please Select--</option>
              <option *ngFor="let company of companies" [value]="company.companyName">
                {{ company.companyName }}
              </option>
            </select>
          </div>
        </div><br>

        <div class="row form-group mt-8">
          <div class="col-sm-4 offset-sm-2">
            <button class="btn btn-primary" [disabled]="!filters.contractNo" (click)="applyFilters()">Search</button>
          </div>
        </div>
      </div><br>


      <div class="mat-elevation-z8">
        <div class="list-container">
          <div class="table-container" class="table-responsive">
            <!-- New div for centering -->
            <table mat-table [dataSource]="dataSource" matSort class="centered-table">
              <ng-container matColumnDef="contractId">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Contract Id </th>
                <td mat-cell *matCellDef="let row"> {{row.contractId}}</td>
              </ng-container>

              <ng-container matColumnDef="contractType">
                <th mat-header-cell *matHeaderCellDef> Contract Type </th>
                <td mat-cell *matCellDef="let row"> {{row.contractType}}</td>
              </ng-container>

              <ng-container matColumnDef="companyName">
                <th mat-header-cell *matHeaderCellDef>Company Name</th>
                <td mat-cell *matCellDef="let row"> {{row.companyName}}</td>
              </ng-container>

              <ng-container matColumnDef="contractNo">
                <th mat-header-cell *matHeaderCellDef> Contract No </th>
                <td mat-cell *matCellDef="let row"> {{row.contractNo}}</td>
              </ng-container>

              <ng-container matColumnDef="contractDate">
                <th mat-header-cell *matHeaderCellDef> Contract Date </th>
                <td mat-cell *matCellDef="let row"> {{row.contractDate | date: 'dd-MM-yyyy' }}</td>
              </ng-container>

              <ng-container matColumnDef="destination">
                <th mat-header-cell *matHeaderCellDef> Destination </th>
                <td mat-cell *matCellDef="let row"> {{row.destination}}</td>
              </ng-container>

              <ng-container matColumnDef="shipmentType">
                <th mat-header-cell *matHeaderCellDef> Shipment Type </th>
                <td mat-cell *matCellDef="let row"> {{row.shipmentType}}</td>
              </ng-container>

              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef> Action </th>
                <td mat-cell *matCellDef="let row">
                  <div style="display: flex; gap: 8px;">

                    <button mat-icon-button color="black" (click)="view(row.contractId)" matTooltip="View">
                      <mat-icon>remove_red_eye</mat-icon>
                    </button>

                    <!-- <button mat-button color="warn" class="btn btn-success mb-2 me-2"
                      style="background-color: #f3260f; color: white;" (click)="reject(row.contractId)"
                      matTooltip="Reject" class="reject-button">
                      Reject
                    </button> -->

                    <button mat-button color="warn" class="btn btn-success mb-2 me-2"
                      [disabled]="rejectedContracts.has(row.contractId)"
                      style="background-color: #f3260f; color: white;" (click)="reject(row.contractId)"
                      matTooltip="Reject">
                      Reject
                    </button>

                  </div>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
          </div>

          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="20"></mat-paginator>
        </div>
      </div>

    </div>
  </mat-card>
</div>
