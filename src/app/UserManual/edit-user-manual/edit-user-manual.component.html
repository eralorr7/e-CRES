<h1 mat-dialog-title>Edit User Manual</h1>

<div mat-dialog-content>
  <form>
    <div class="form-group">
      <label for="image">Upload</label>
      <input type="file" id="userManual" (change)="handleFileInput($event)" class="form-control" />
      <small>Current file: {{ userManual.userManual }}</small>
    </div>
  </form>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onSubmit()">Save</button>
</div>
